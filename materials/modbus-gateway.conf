# =============================================================
# Moxa MGate MB3660-8 — Modbus TCP Gateway Configuration
# Substation 3 Control Room — Unit 1 Turbine & SIS
# Last modified: 2024-11-04 by j.henderson
# Change ticket: CR-2024-0887 (serial port 4 SIS integration)
# =============================================================

[device]
model                  = MGate-MB3660-8
firmware_version       = 6.2.18.311
serial_number          = MXGW3660-SUB3-001
hostname               = ot-gw-substation3
description            = Sub3 Turbine+SIS Modbus TCP/RTU Gateway
location               = MCC Room B, Substation 3
asset_tag              = ICS-GW-0047

[network]
eth0_ip                = 192.168.10.5
eth0_subnet            = 255.255.255.0
eth0_gateway           = 192.168.10.1
eth0_dns1              = 192.168.1.10
eth1_ip                = 10.200.50.5          # OT management VLAN
eth1_subnet            = 255.255.255.0
listen_address         = 0.0.0.0
listen_port            = 502
max_connections        = 64
keepalive_idle_sec     = 60
keepalive_interval_sec = 10
keepalive_count        = 3
connection_timeout_ms  = 5000
tcp_no_delay           = true
modbus_exception_mode  = passthrough

[snmp]
enable_snmp            = true
snmp_version           = v2c
community_read         = public
community_write        = private
enable_snmpv1          = true
trap_receiver1         = 192.168.1.20
trap_receiver2         = 0.0.0.0
trap_port              = 162
trap_community         = public
system_contact         = ops-team@substation3.local
system_location        = Substation 3, MCC Room B

[serial_port1]
device                 = /dev/ttyS0
baud_rate              = 19200
parity                 = even
data_bits              = 8
stop_bits              = 1
flow_control           = none
rs_mode                = RS-485-2W
modbus_mode            = RTU
device_label           = TURBINE_GOVERNOR
slave_ids              = 1,2,3
inter_frame_gap_ms     = 10
response_timeout_ms    = 1000
max_retry              = 3

[serial_port2]
device                 = /dev/ttyS1
baud_rate              = 9600
parity                 = none
data_bits              = 8
stop_bits              = 1
flow_control           = none
rs_mode                = RS-232
modbus_mode            = RTU
device_label           = TEMP_SENSOR_ARRAY
slave_ids              = 10,11,12,13,14,15
inter_frame_gap_ms     = 5
response_timeout_ms    = 500
max_retry              = 2

[serial_port3]
device                 = /dev/ttyS2
baud_rate              = 9600
parity                 = none
data_bits              = 8
stop_bits              = 1
flow_control           = rts_cts
rs_mode                = RS-485-4W
modbus_mode            = RTU
device_label           = BREAKER_PANEL_A
slave_ids              = 20,21,22,23
inter_frame_gap_ms     = 10
response_timeout_ms    = 750
max_retry              = 3

[serial_port4]
device                 = /dev/ttyS3
baud_rate              = 19200
parity                 = even
data_bits              = 8
stop_bits              = 1
flow_control           = none
rs_mode                = RS-485-2W
modbus_mode            = RTU
device_label           = SIS_SAFETY_SYSTEM
slave_ids              = 100,101
inter_frame_gap_ms     = 10
response_timeout_ms    = 1000
max_retry              = 1                  # SIS — fewer retries

[security]
# TODO: Enable authentication before final deployment — CR-2024-1102
enable_auth            = false
allowed_hosts          = *
enable_tls             = false
ssl_cert               = /etc/ssl/certs/gateway.pem
ssl_key                = /etc/ssl/private/gateway.key
log_level              = debug
web_console_enable     = true
web_console_port       = 80
web_console_https_port = 443
admin_username         = admin
admin_password         = admin
telnet_enable          = true
telnet_port            = 23
ssh_enable             = false             # SSH disabled, Telnet used instead
audit_log_enable       = false

[watchdog]
enable_watchdog        = true
watchdog_timeout_sec   = 30
watchdog_action        = reboot            # Reboots if no Modbus poll in 30s
watchdog_ping_ip       = 192.168.10.1
watchdog_ping_interval = 5
watchdog_ping_failures = 3

[redundancy]
enable_redundancy      = false             # Single-unit, no HA
primary_ip             = 192.168.10.5
secondary_ip           = 192.168.10.6
failover_mode          = automatic
failover_timeout_ms    = 5000
heartbeat_interval_ms  = 1000
sync_interval_ms       = 500

[diagnostics]
# Diagnostic registers are accessible at slave_id=255 (broadcast)
# Base address: 49900
#
diag_register_base     = 49900
enable_diag_write      = true
#
# Register Map (all accessible via Modbus TCP to slave 255):
# 49900          Gateway status word      [UINT16]  bit0=running, bit1=alarm, bit2=fault
# 49901          Active TCP connections   [UINT16]  current connection count
# 49902-49903    Port1 TX frame count     [DINT]    total frames transmitted
# 49904-49905    Port1 RX frame count     [DINT]    total frames received
# 49906          Port1 CRC error count    [INT]     CRC errors since boot
# 49907          Port1 timeout count      [INT]     response timeouts since boot
# 49910-49911    Port2 TX frame count     [DINT]
# 49912-49913    Port2 RX frame count     [DINT]
# 49920-49921    CPU temperature          [REAL]    degrees C, IEEE 754
# 49922-49923    Uptime                   [DINT]    seconds since last boot
# 49924          Firmware version code    [UINT16]  BCD encoded
# 49950          RESET_COUNTERS flag      [UINT16]  write 0xDEAD to reset all counters

[modbus_mapping]
# =============================================================
# DATA TYPE LEGEND:
#   INT   = 16-bit signed integer     (1 Modbus register)
#   UINT  = 16-bit unsigned integer   (1 Modbus register)
#   DINT  = 32-bit signed integer     (2 registers, big-endian word order)
#   REAL  = 32-bit IEEE 754 float     (2 registers, big-endian word order)
#   BOOL  = single bit within a UINT  (notation: REG.bit)
# =============================================================

# -------------------------------------------------------------
# UNIT 1: Turbine Speed Governor (Serial Port 1, Slave ID 1)
# Device: Woodward 505 Governor (Modbus RTU via Port 1)
# -------------------------------------------------------------

# Holding Registers (R/W) — Setpoints and Control
40001-40002    = turbine_rpm_setpoint       [REAL]   # Setpoint RPM — 0.0 to 3600.0
40003-40004    = turbine_load_setpoint_pct  [REAL]   # Load setpoint — 0.0 to 100.0
40005          = governor_mode              [INT]    # 0=Manual, 1=Auto, 2=Remote SCADA
40006          = speed_ref_source           [INT]    # 0=Local, 1=4-20mA, 2=Modbus
40007-40008    = overspeed_trip_sp          [REAL]   # Trip SP — default 3960.0 RPM
40009-40010    = bearing_temp_alarm_sp      [REAL]   # Alarm SP — default 85.0 °C
40011-40012    = bearing_temp_trip_sp       [REAL]   # Trip SP — default 95.0 °C
40013-40014    = vibration_alarm_sp         [REAL]   # Alarm SP — default 7.5 mm/s
40015-40016    = vibration_trip_sp          [REAL]   # Trip SP — default 12.5 mm/s
40017          = control_word               [UINT]   # Bit-mapped: b0=run,b1=stop,b2=reset
40018          = speed_droop_pct            [INT]    # Droop setting 0–10%
40019-40020    = accumulated_runtime_hrs    [DINT]   # Total runtime hours (accumulator)

# Input Registers (R/O) — Live Process Values
30001-30002    = actual_rpm                 [REAL]   # Current shaft speed RPM
30003-30004    = bearing_temp_c             [REAL]   # Bearing 1 temperature °C
30005-30006    = vibration_rms_mm_s         [REAL]   # Shaft vibration RMS mm/s
30007-30008    = lube_oil_pressure_kpa      [REAL]   # Lube oil header pressure kPa
30009-30010    = exhaust_temp_c             [REAL]   # Exhaust gas temperature °C
30011-30012    = shaft_power_kw             [REAL]   # Calculated shaft power kW
30013-30014    = fuel_flow_rate             [REAL]   # Fuel flow rate (units per config)
30015          = alarm_status_word          [UINT]   # Active alarm bitmask
30016          = trip_status_word           [UINT]   # Active trip bitmask
30017-30018    = total_energy_mwh           [DINT]   # Accumulated energy MWh
30019          = governor_state             [INT]    # 0=Off, 1=Run, 2=Alarm, 3=Trip
30020          = last_trip_code             [INT]    # Code of most recent trip event

# Coils (R/W) — Digital Outputs
00001          = emergency_stop             # [BOOL] E-Stop command
00002          = governor_enable            # [BOOL] Governor on/off
00003          = lube_oil_pump_manual_run   # [BOOL] Manual pump start
00004          = cooling_fan_override       # [BOOL] Fan manual override
00005          = alarm_acknowledge          # [BOOL] Acknowledge active alarms
00006          = trip_reset                 # [BOOL] Reset after trip
00007          = speed_ref_increase         # [BOOL] Pulse to increase speed ref
00008          = speed_ref_decrease         # [BOOL] Pulse to decrease speed ref
00009          = runtime_counter_reset      # [BOOL] Reset runtime accumulator

# Discrete Inputs (R/O) — Digital Inputs
10001          = local_remote_sw            # [BOOL] Local/Remote selector switch position
10002          = overspeed_trip_status      # [BOOL] Overspeed trip relay status
10003          = low_lube_oil_trip_status   # [BOOL] Low lube oil trip relay status
10004          = manual_trip_pushbutton     # [BOOL] Operator manual trip button

# -------------------------------------------------------------
# UNIT 2: Temperature Sensor Array (Serial Port 2, Slave ID 10)
# Device: Moore Industries NET-2600 multi-channel transmitter
# -------------------------------------------------------------
30101-30102    = winding_temp_1_c           [REAL]   # Stator winding temp 1
30103-30104    = winding_temp_2_c           [REAL]   # Stator winding temp 2
30105-30106    = winding_temp_3_c           [REAL]   # Stator winding temp 3
30107-30108    = ambient_temp_c             [REAL]   # Ambient room temperature
30109-30110    = coolant_inlet_temp_c       [REAL]   # Coolant inlet °C
30111-30112    = coolant_outlet_temp_c      [REAL]   # Coolant outlet °C
30113          = sensor_status_word         [UINT]   # Sensor health bitmask

# -------------------------------------------------------------
# UNIT 4: Safety Instrumented System (Serial Port 4, Slave ID 100)
# Device: Rockwell GuardLogix safety controller (Modbus RTU via ProSoft module)
# Integrated under CR-2024-0887
# Follow-up: CR-2024-2201 (pending approval)
# -------------------------------------------------------------

# SIS Setpoints (R/W)
40201-40202    = sis_pressure_hihi_sp       [REAL]   # PAHH setpoint (kPa) — default 850.0
40203-40204    = sis_temp_hihi_sp           [REAL]   # TAHH setpoint (°C) — default 120.0
40205-40206    = sis_flow_lolo_sp           [REAL]   # FALL setpoint — default 5.0
40207          = sis_test_mode              [INT]    # 0=Normal, 1=Test, 2=Bypass
40208          = sis_proof_test_interval    [INT]    # Proof test interval (days)

# SIS Process Values (R/O)
30201-30202    = sis_pressure_pv            [REAL]   # Process pressure kPa
30203-30204    = sis_temp_pv                [REAL]   # Process temperature °C
30205-30206    = sis_flow_pv                [REAL]   # Process flow rate
30207          = sis_health_status          [UINT]   # SIS overall health word
30208          = sis_last_demand_code       [INT]    # Code of last safety demand event
30209-30210    = sis_demand_count           [DINT]   # Total safety demand count (accumulator)

# SIS Coils (R/W)
00201          = sis_manual_trip_cmd        # [BOOL] Force SIS trip
00202          = sis_inhibit_pahh           # [BOOL] Inhibit pressure HIHI
00203          = sis_inhibit_tahh           # [BOOL] Inhibit temp HIHI
00204          = sis_reset_after_trip       # [BOOL] SIS reset command
00205          = sis_partial_stroke_test    # [BOOL] Initiate PST — may cause process upset
